<script>
const defaults={heading:'A Formal Invitation',salutation:'Dear John,',body:'The University of Texas at Austin is more than a place. It is a tradition of excellence, leadership, and determination. It is where determined young men become Longhorns for life.\n\nIt’s Texas. Hook ’em.',closing:'With highest regards,',sender:'Coach Reed',senderTitle:'Texas Football',music:true};
function decodePayload(){try{const raw=location.hash.slice(1);if(!raw)return defaults;const json=decodeURIComponent(escape(atob(raw.replace(/-/g,'+').replace(/_/g,'/'))));return {...defaults,...JSON.parse(json)}}catch(e){console.warn('Using defaults',e);return defaults}}
const data=decodePayload();
const $=id=>document.getElementById(id);
$('heading').textContent=data.heading||'';$('salutation').textContent=data.salutation||'';$('closing').textContent=data.closing||'';$('signature').textContent=data.sender||'';$('sender').textContent=data.sender||'';$('senderTitle').textContent=data.senderTitle||'';
const normalized=String(data.body||'').replace(/\\n/g,'\n');normalized.split(/\n\s*\n/).filter(Boolean).forEach(t=>{const p=document.createElement('p');p.textContent=t;$('body').appendChild(p)});
const audio=$('music');let playing=false;audio.volume=.48;
async function startMusic(){if(data.music===false)return;try{await audio.play();playing=true;$('musicBtn').textContent='Ⅱ'}catch(e){$('musicBtn').textContent='▶'}}
$('seal').addEventListener('click',()=>{const w=$('envelopeWrap');w.classList.add('opening');startMusic();setTimeout(()=>{$('intro').classList.add('hidden');$('letterScene').classList.add('show');$('letterScene').setAttribute('aria-hidden','false');document.body.style.overflow='auto'},1180)});
$('musicBtn').addEventListener('click',async()=>{if(audio.paused){await startMusic()}else{audio.pause();playing=false;$('musicBtn').textContent='▶'}});
$('volume').addEventListener('input',e=>audio.volume=Number(e.target.value));
$('shareBtn').addEventListener('click',async()=>{try{await navigator.share({title:document.title,url:location.href})}catch(e){try{await navigator.clipboard.writeText(location.href);$('shareBtn').textContent='Link copied';setTimeout(()=>$('shareBtn').textContent='Share this letter',1400)}catch(_){prompt('Copy this link:',location.href)}}});
</script>
